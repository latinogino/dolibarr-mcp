---
files: ^(.*\.(py|json|md|sh|yaml|cfg|txt))$
exclude: ^(\.[^/]*cache/.*)$
repos:
  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # 1.0.0
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat
        language: python
        types: [markdown]
        args: [--wrap, '105', --number]
        additional_dependencies:
          - mdformat-toc
          - mdformat-beautysh
          # - mdformat-shfmt
          # - mdformat-tables
          - mdformat-config
          - mdformat-black
          - mdformat-web
          - mdformat-gfm
          - setuptools
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, test_branch]
        # args: [--branch, main]
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: mixed-line-ending
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: fix-byte-order-marker
      - id: check-case-conflict
      # - id: check-toml
  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args:
          - --no-warnings
          - -d
          - '{extends: relaxed, rules: {line-length: {max: 90}}}'
  - repo: https://github.com/lovesegfault/beautysh.git
    rev: 885128fe2600889194c69fa19326cf55a3462777  # v6.4.3
    hooks:
      - id: beautysh
        # additional_dependencies: [setuptools]  # workaround for beautysh
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # v2.4.3
    hooks:
      - id: codespell
        args:
          # - --builtin=clear,rare,informal,usage,code,names,en-GB_to_en-US
          - --builtin=clear,rare,informal,usage,code,names
          - --ignore-words-list=master,stdio,thirdparty,uis
          - --skip="./.*"
          - --quiet-level=2
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py37-plus]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: be256dab724687e8c3d7d6f52c1b263e2de6d439  # v1.0.6
    hooks:
      - id: python-bandit-vulnerability-check
        args: [--recursive, ., --skip, 'B101,B104,B110']
  - repo: https://github.com/PyCQA/autoflake
    rev: 6d9dd2716540ab776f29c7b896cd3052ef4619b2  # v2.4.0
    hooks:
      - id: autoflake
        args: [-i, -r, --expand-star-imports, custom_components]
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
    hooks:
      - id: black
        args: [--safe, --quiet, -l 130]
  - repo: https://github.com/PyCQA/flake8
    rev: d93590f5be797aabb60e3b09f2f52dddb02f349f  # 7.3.0
    hooks:
      - id: flake8
        args: [--ignore, 'E501']
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8_2020
          - mccabe
          - pycodestyle
          - pyflakes
  - repo: https://github.com/PyCQA/isort
    rev: 8d8d49d0f5ded46bb10bb860b0841be14ba42a65  # 9.0.0b2
    hooks:
      - id: isort
        args: [--profile, black]
  - repo: https://github.com/pylint-dev/pylint
    rev: f5a6e3b1de17502747a40d7f92f285ccf9c6c459  # v4.0.7
    hooks:
      - id: pylint
        args: ['--init-hook="import sys; sys.path.append(\"./src\")"','--disable=line-too-long']
        additional_dependencies:
          - pytest
          - mcp>=1.9.0,<2.0.0
          - aiohttp
          - pydantic
          - pydantic-settings
          - click
          - python-dotenv
          - uvicorn
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356  # v2.3.0
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
          - --check-untyped-defs
          - --show-error-codes
          - --show-error-context
          - --disable-error-code=name-defined
        additional_dependencies:
          - pylint
          - mcp>=1.9.0,<2.0.0
          - aiohttp
          - pydantic
          - pydantic-settings
          - click
          - python-dotenv
          - uvicorn
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - pytest
          - regex
